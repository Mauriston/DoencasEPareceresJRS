<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>JRS/HNRe</title>
    <!-- Ícone da aba do navegador (favicon) -->
    <link rel="icon" type="image/png" href="https://i.imgur.com/8HeAdv4.png" />
    <link rel="shortcut icon" type="image/png" href="https://i.imgur.com/8HeAdv4.png" />
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="JRS/HNRe" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://i.imgur.com/b4LBks6.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:description" content="Guia para a avaliação pericial dos portadores de doenças especificadas em lei." />
    <!-- Ícone Personalizado para iPhone (iOS) -->
    <link rel="apple-touch-icon" href="https://i.imgur.com/8HeAdv4.png" />
    <!-- Ao adicionar à tela inicial, abre como app (sem barra do navegador) -->
    <link rel="manifest" href="/DoencasEPareceresJRS/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="JRS/HNRe App" />
    <!-- Barra de status: uma cor por esquema do sistema; o script abaixo (e hooks/useTema.ts) troca
         as duas quando o usuário força Claro/Escuro em Meu perfil → Aparência. -->
    <meta name="theme-color" content="#050F41" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070C2A" media="(prefers-color-scheme: dark)" />
    <!-- Tema antes do React montar (sem clarão branco ao abrir o PWA à noite). Mesma lógica de hooks/useTema.ts. -->
    <script>
      (function () {
        var p = {};
        try { p = JSON.parse(localStorage.getItem('jrs-tema') || '{}') || {}; } catch (e) {}
        var modo = p.modo === 'claro' || p.modo === 'escuro' ? p.modo : 'sistema';
        var variante = p.variante === 'grafite' || p.variante === 'oled' ? p.variante : 'marinho';
        var escuro = modo === 'escuro' || (modo === 'sistema' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var raiz = document.documentElement;
        raiz.setAttribute('data-theme', escuro ? 'dark' : 'light');
        raiz.setAttribute('data-variante', variante);
        var cor = { marinho: '#070C2A', grafite: '#111216', oled: '#000000' }[variante];
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) {
          if (modo === 'sistema') metas[i].content = metas[i].media.indexOf('dark') >= 0 ? cor : '#050F41';
          else metas[i].content = escuro ? cor : '#050F41';
        }
      })();
    </script>
    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JRS/HNRe" />
    <meta name="twitter:description" content="Guia para a avaliação pericial dos portadores de doenças especificadas em lei." />
    <meta name="twitter:image" content="https://i.imgur.com/b4LBks6.png" />
    <!-- Tailwind é compilado no build (Vite + PostCSS) a partir de tailwind.config.js; Montserrat e a
         fonte de ícones (Material Symbols) são autohospedadas (styles/fonts.css, assets/fonts/). -->
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
