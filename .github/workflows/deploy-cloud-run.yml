name: Deploy API to Cloud Run

# O frontend (site estático) vai para o GitHub Pages (ver deploy.yml); este
# workflow publica só o backend (server.ts, endpoints /api/* que falam com o
# Gemini) no Cloud Run, no mesmo projeto Google Cloud do Firebase.
#
# Antes do primeiro deploy, configure no repositório (Settings > Secrets and
# variables > Actions):
#   Secrets:
#     GCP_PROJECT_ID   - id do projeto (ex.: jrs-app-web)
#     GCP_SA_KEY       - chave JSON de uma service account com papéis
#                        "Cloud Run Admin", "Artifact Registry Writer",
#                        "Cloud Build Editor" e "Service Account User"
#     GEMINI_API_KEY   - a mesma chave usada hoje pelo app
#     GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET (opcionais) - cliente
#                        OAuth "Aplicativo da Web" que deixa o servidor enviar os
#                        e-mails de impressão e sincronizar o Google Agenda pela
#                        conta Google da JRS (servidor/google/; ver
#                        docs/configuracao.md). Sem eles, o app usa o Apps Script.
#     AGENDADOR_TOKEN (opcional) - token (mín. 32 caracteres; openssl rand -hex 32)
#                        que o Cloud Scheduler envia ao disparar o e-mail "IS
#                        AGENDADAS" das 18h (scripts/agendador/configurar-email-agenda.sh).
#                        Sem ele, o envio automático fica desligado; o manual segue.
#   Variables (opcional):
#     ALLOWED_ORIGIN   - origem do frontend publicado, se for diferente de
#                        https://mauriston.github.io (ex.: domínio próprio)
#     SPEECH_LOCALIZACAO - região do Speech-to-Text (Chirp 3) da entrevista da IS;
#                        padrão "us" (servidor/entrevistas/transcricao.ts)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'server.ts'
      - 'servidor/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy-cloud-run.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  SERVICE_NAME: jrs-hnre-api
  REGION: southamerica-east1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Deploy no Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          source: .
          # 2 GiB: o Chromium dos documentos em PDF (servidor/documentos/) e o áudio da entrevista da IS
          # (até 80 MB + o FLAC convertido, em /tmp, que no Cloud Run ocupa memória) com o ffmpeg.
          flags: --allow-unauthenticated --memory=2Gi
          env_vars: |
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            GOOGLE_OAUTH_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
            GOOGLE_OAUTH_CLIENT_SECRET=${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
            AGENDADOR_TOKEN=${{ secrets.AGENDADOR_TOKEN }}
            ALLOWED_ORIGIN=${{ vars.ALLOWED_ORIGIN || 'https://mauriston.github.io' }}
            SPEECH_LOCALIZACAO=${{ vars.SPEECH_LOCALIZACAO || 'us' }}

      - name: URL do serviço
        run: |
          echo "Backend publicado em: ${{ steps.deploy.outputs.url }}"
          echo "Defina essa URL na variável de repositório API_BASE_URL (Settings > Secrets and variables > Actions > Variables) e rode novamente o workflow 'Deploy to GitHub Pages' para o frontend passar a usá-la."
