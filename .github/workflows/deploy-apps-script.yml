name: Deploy Apps Script

# Publica os projetos de apps-script/ quando o código muda na main, mantendo a mesma URL do web app.
# Fala direto com a API do Apps Script usando uma conta de serviço com delegação em todo o domínio.
# Precisa do secret GAS_SA_KEY (JSON da chave da conta de serviço) e de GAS_IMPERSONATE (e-mail do dono
# dos projetos) — ver docs/apps-script-deploy.md.
on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps-script/**'
      - 'scripts/gas-deploy.mjs'
  workflow_dispatch:
    inputs:
      projeto:
        description: 'Projeto a publicar'
        required: true
        default: todos
        type: choice
        options: [ todos, principal, concursos ]

permissions:
  contents: read

concurrency:
  group: apps-script-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Conferir credenciais
        env:
          GAS_SA_KEY: ${{ secrets.GAS_SA_KEY }}
          GAS_IMPERSONATE: ${{ secrets.GAS_IMPERSONATE }}
        run: |
          if [ -z "$GAS_SA_KEY" ]; then echo "::error::Secret GAS_SA_KEY não configurado (ver docs/apps-script-deploy.md)."; exit 1; fi
          if [ -z "$GAS_IMPERSONATE" ]; then echo "::error::Secret GAS_IMPERSONATE não configurado (ver docs/apps-script-deploy.md)."; exit 1; fi

      - name: Publicar
        env:
          GAS_SA_KEY: ${{ secrets.GAS_SA_KEY }}
          GAS_IMPERSONATE: ${{ secrets.GAS_IMPERSONATE }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/gas-deploy.mjs "${{ inputs.projeto }}"
          else
            node scripts/gas-deploy.mjs todos --so-se-mudou="${{ github.event.before }}"
          fi
