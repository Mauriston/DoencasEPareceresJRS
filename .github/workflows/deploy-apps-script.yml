name: Deploy Apps Script

# Publica os projetos de apps-script/ (clasp) quando o código muda na main, mantendo a mesma URL do web app.
# Precisa do secret CLASPRC_JSON (conteúdo de ~/.clasprc.json depois de "clasp login") — ver docs/apps-script-deploy.md.
on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps-script/**'
      - 'scripts/gas-deploy.mjs'
  workflow_dispatch:
    inputs:
      projeto:
        description: 'Projeto a publicar'
        required: true
        default: todos
        type: choice
        options: [ todos, principal, concursos ]

permissions:
  contents: read

concurrency:
  group: apps-script-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Credenciais do clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then echo "::error::Secret CLASPRC_JSON não configurado (ver docs/apps-script-deploy.md)."; exit 1; fi
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Publicar
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/gas-deploy.mjs "${{ inputs.projeto }}"
          else
            node scripts/gas-deploy.mjs todos --so-se-mudou="${{ github.event.before }}"
          fi
