name: Deploy Firebase Rules

# Publica firestore.rules e storage.rules no projeto Firebase a cada mudança
# na main — assim as regras no ar nunca ficam atrás do código. Antes de
# publicar, testa o comportamento das regras do Firestore no simulador da
# API Firebase Rules (scripts/testar-regras-firestore.cjs): se algum caso
# falhar, nada é publicado.
#
# Credencial: secret FIREBASE_RULES_SA_KEY (chave JSON de uma service account
# com o papel "Firebase Rules Admin"); se não existir, usa GCP_SA_KEY (a mesma
# do deploy do Cloud Run), que então precisa ganhar esse papel no IAM do
# projeto.

on:
  push:
    branches: [ "main" ]
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - 'scripts/testar-regras-firestore.cjs'
      - '.github/workflows/deploy-firestore-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FIREBASE_PROJECT_ID: jrs-app-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_RULES_SA_KEY || secrets.GCP_SA_KEY }}'

      - name: Testar as regras do Firestore
        run: node scripts/testar-regras-firestore.cjs

      - name: Publicar as regras (Firestore e Storage)
        run: npx --yes firebase-tools@13 deploy --only firestore:rules,storage --project "$FIREBASE_PROJECT_ID" --non-interactive
